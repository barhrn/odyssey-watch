name: Odyssey IMAX watch

on:
  schedule:
    # Every 15 minutes, deliberately off the top of the hour: GitHub delays
    # scheduled runs under load, and :00 is the worst-hit slot.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:          # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write             # needed to commit the state file back

concurrency:
  group: odyssey-watch        # never let two checks overlap and double-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Without these, the run would consume the state silently and you would
      # never hear about the screenings it just marked as seen.
      - name: Require Telegram secrets
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "::error::Set the TG_BOT_TOKEN and TG_CHAT_ID repository secrets."
            exit 1
          fi

      - name: Check for new screenings
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 odyssey_watch.py

      - name: Remember what was already reported
        run: |
          if [ -n "$(git status --porcelain odyssey_state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add odyssey_state.json
            git commit -m "state: seen screenings $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "no state change"
          fi
